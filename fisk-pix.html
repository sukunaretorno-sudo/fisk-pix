<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fisk Pix</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Old+Standard+TT:wght@400;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--teal:#e31e24;--ink:#1c3f8f;--deep:#14295e;--paper:#f4f7fc;--card:#ffffff;--line:#c3cfe8;--ok:#1e7a46;--bad:#a30f14;--on:#ffffff;
--disp:'Archivo Black','Arial Black',Impact,sans-serif;--serif:'Old Standard TT',Georgia,'Times New Roman',serif;--mono:'Roboto Mono',ui-monospace,Menlo,monospace;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--teal:#e8363c;--ink:#8fb1ff;--deep:#e4ebff;--paper:#0c1530;--card:#13214a;--line:#2c3f7a;--ok:#6fd49b;--bad:#f08a8a}}
:root[data-theme="dark"]{--teal:#e8363c;--ink:#8fb1ff;--deep:#e4ebff;--paper:#0c1530;--card:#13214a;--line:#2c3f7a;--ok:#6fd49b;--bad:#f08a8a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--deep);font-family:var(--serif);min-height:100vh;
background-image:repeating-linear-gradient(180deg,transparent 0 26px,color-mix(in srgb,var(--teal) 6%,transparent) 26px 52px)}
.wrap{max-width:520px;margin:0 auto;padding:14px}
.note{position:relative;background:var(--card);border:3px solid var(--ink);border-radius:14px;padding:18px;
box-shadow:0 0 0 4px var(--card),0 0 0 7px var(--teal);margin:12px 8px}
.note::before{content:"";position:absolute;inset:6px;border:1px dashed var(--line);border-radius:9px;pointer-events:none;
background:none}
.note>*{position:relative}
.fisk{font-family:var(--disp);color:var(--teal);letter-spacing:-1px;text-transform:uppercase;line-height:1}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.top .fisk{font-size:34px}
.small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.title{font-weight:700;text-align:center;text-transform:uppercase;letter-spacing:.12em;color:var(--ink);font-size:13px;margin:6px 0}
.buddy{width:68px;height:68px;border-radius:50%;border:3px solid var(--teal);box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--ink);object-fit:cover;flex:none;background:#bfe3f7}.flag{position:relative;width:48px;height:30px;border-radius:3px;border:1px solid var(--line);background:repeating-linear-gradient(180deg,#e31e24 0 2.3px,#fff 2.3px 4.6px)}.flag::before{content:"";position:absolute;left:0;top:0;width:21px;height:16px;background:radial-gradient(circle,#fff .9px,transparent 1.3px) 0 0/5px 4px,#1c3f8f}.wrap::before{content:"★ ★ ★ ★ ★ ★ ★";display:block;overflow:hidden;white-space:nowrap;color:#fff;font-size:9px;line-height:16px;padding-left:8px;height:16px;margin:0 8px;border-radius:4px;background:linear-gradient(#1c3f8f,#1c3f8f) left/22% 100% no-repeat,repeating-linear-gradient(180deg,#e31e24 0 4px,#fff 4px 8px)}
.bal{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0 4px}
.bal b{font-family:var(--disp);font-size:44px;color:var(--teal);line-height:1}
.serial{font-family:var(--mono);font-size:12px;color:var(--ink);display:flex;justify-content:space-between}
.legal{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink);text-align:center;margin-top:8px}
.tabs{display:flex;gap:6px;margin:12px 7px 0}
.tabs button{flex:1;font:700 12px var(--serif);letter-spacing:.1em;text-transform:uppercase;padding:10px 4px;border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:4px;cursor:pointer}
.tabs button.on{background:var(--teal);color:var(--on)}
label{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);margin:12px 0 4px;font-weight:700}
input,select{width:100%;font:16px var(--mono);padding:11px;border:2px solid var(--line);border-radius:4px;background:var(--paper);color:var(--deep)}
input:focus,select:focus{outline:none;border-color:var(--teal)}
.btn{width:100%;margin-top:16px;font:400 18px var(--disp);letter-spacing:.04em;text-transform:uppercase;padding:13px;border:0;border-radius:4px;background:var(--teal);color:var(--on);cursor:pointer;box-shadow:0 3px 0 color-mix(in srgb,var(--teal) 60%,#000)}
.btn.alt{background:transparent;color:var(--ink);box-shadow:none;border:2px solid var(--ink);font-size:13px;margin-top:8px;padding:9px}
.btn:active{transform:translateY(1px)}
.msg{margin-top:12px;font-size:14px;text-align:center;min-height:20px}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px}
.row:last-child{border:0}.row small{display:block;color:var(--ink);font-size:11px;font-family:var(--mono)}
.pos{color:var(--ok);font-weight:700;white-space:nowrap}.neg{color:var(--bad);font-weight:700;white-space:nowrap}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:7px 4px;border-bottom:1px dashed var(--line)}
th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
h3{margin:18px 0 0;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
.empty{text-align:center;color:var(--ink);padding:14px;font-size:14px}
.streak{display:flex;align-items:center;gap:14px}.streak b{font:400 38px var(--disp);color:#ff9600}.streak small{display:block;color:var(--ink);font-size:11px}.fl{font-size:48px;line-height:1}.fl.off{filter:grayscale(1);opacity:.5}.dots{display:flex;gap:5px;margin-top:6px}.dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;color:#fff}.dot.p{background:#ff9600}.dot.f{background:var(--bad)}.ab{display:flex;gap:6px}.mk{font:700 11px var(--serif);text-transform:uppercase;padding:8px 10px;border-radius:4px;border:2px solid var(--ok);background:transparent;color:var(--ok);cursor:pointer}.mk.f{border-color:var(--bad);color:var(--bad)}.mk.on{background:var(--ok);color:#fff}.mk.f.on{background:var(--bad)}.login{margin-top:8vh}.login .fisk{font-size:64px;text-align:center}
</style>
</head>

const BADGE=`<svg viewBox="0 0 260 220" width="180" role="img" aria-label="Falou Fisk, falou tudo"><defs><path id="ta" d="M56,110 A74,74 0 0 1 204,110"/><path id="ba" d="M44,110 A86,86 0 0 0 216,110"/></defs><circle cx="130" cy="110" r="100" fill="none" style="stroke:var(--teal)" stroke-width="6"/><rect x="20" y="80" width="220" height="58" style="fill:var(--card)"/><text font-family="Archivo Black,Arial Black,sans-serif" font-size="23" text-anchor="middle" style="fill:var(--teal)"><textPath href="#ta" startOffset="50%">FALOU</textPath></text><text font-family="Archivo Black,Arial Black,sans-serif" font-size="23" text-anchor="middle" style="fill:var(--teal)"><textPath href="#ba" startOffset="50%">FALOU TUDO</textPath></text><text x="130" y="130" text-anchor="middle" font-family="Archivo Black,Arial Black,sans-serif" font-size="58" textLength="210" lengthAdjust="spacingAndGlyphs" style="fill:var(--teal)">FISK</text><text x="0" y="116" font-size="20" style="fill:var(--teal)">★</text><text x="238" y="116" font-size="20" style="fill:var(--teal)">★</text></svg>`;
const ROLE={aluno:'Aluno',admin:'Administrador',teacher:'Teacher'};
const KEY='fiskpix_v1';
let S,me=null,tab='pix',msg=null,pend=null,rcpt=null,filt='all',adate=new Date().toLocaleDateString('sv-SE');
const $=s=>document.querySelector(s);
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
 if(!S||!S.bal)S={bal:{tyller:50,bia:50,cadu:0,teacher:0},tx:[]};
 S.users=S.users||{};S.pw=S.pw||{};S.seen=S.seen||{};S.fail=S.fail||{};S.att=S.att||{};
 for(const k in S.users){USERS[k]=S.users[k];if(S.bal[k]==null)S.bal[k]=0}
 for(const k in S.pw)if(USERS[k])USERS[k].h=S.pw[k]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const fmt=n=>'F$ '+Number(n).toLocaleString('pt-BR');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const when=t=>new Date(t).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function serial(u){let n=0;for(const c of u)n=(n*31+c.charCodeAt(0))%100000000;return 'B '+String(n).padStart(8,'0')+' K'}
function log(o){S.tx.unshift({t:Date.now(),...o});S.tx=S.tx.slice(0,300);save()}
function setMsg(t,k){msg={t,k}}

async function doLogin(){
 const u=$('#nick').value.trim().toLowerCase(),p=$('#pw').value;
 const user=USERS[u],f=S.fail[u]||{n:0,t:0};
 if(f.n>=5&&Date.now()-f.t<300000){setMsg('Conta bloqueada por 5 minutos após 5 tentativas erradas.','bad');return render()}
 let ok=false;
 try{ok=user&&(await sha(p))===user.h}catch(e){}
 if(!ok){if(user){S.fail[u]={n:(f.n>=5?0:f.n)+1,t:Date.now()};save()}setMsg('Usuário ou senha incorretos.','bad');return render()}
 delete S.fail[u];
 me=u;tab='pix';msg=null;
 const got=S.tx.filter(x=>x.type==='pix'&&x.to===u&&x.t>(S.seen[u]||0));
 if(got.length)setMsg('Você recebeu '+got.length+' Pix novo(s), somando '+fmt(got.reduce((a,x)=>a+x.amt,0))+'. Falou Fisk, falou tudo!','ok');
 S.seen[u]=Date.now();save();render();
}
function logout(){me=null;pend=rcpt=null;tab='pix';msg=null;render()}

function sendPix(){
 const to=$('#to').value,amt=parseInt($('#amt').value,10),note=$('#note').value.trim().slice(0,60);
 if(!amt||amt<1)return fail('Informe um valor válido.');
 if(amt>S.bal[me])return fail('Saldo insuficiente.');
 if(!USERS[to]||to===me)return fail('Destinatário inválido.');
 pend={to,amt,note};render();return}
function confirmPix(){if(!pend)return;const{to,amt,note}=pend;pend=null;if(amt>S.bal[me])return fail('Saldo insuficiente.');
 S.bal[me]-=amt;S.bal[to]+=amt;
 const id='P'+Date.now().toString(36).toUpperCase();log({type:'pix',from:me,to,amt,note,id});rcpt=S.tx[0];
 setMsg('Pix de '+fmt(amt)+' enviado para '+USERS[to].name+'.','ok');render();
}
function fail(t){setMsg(t,'bad');render()}

function adminAct(kind){
 const to=$('#au').value,amt=parseInt($('#aa').value,10);
 if(isNaN(amt)||amt<0||(kind!=='set'&&amt<1))return fail('Informe um valor válido.');
 const old=S.bal[to];let nv;
 if(kind==='mint'){if(me!=='cadu')return;nv=old+amt}
 else if(me!=='teacher')return;
 else if(kind==='set')nv=amt;
 else{if(amt>old)return fail('A retirada excede o saldo de '+USERS[to].name+'.');nv=old-amt}
 S.bal[to]=nv;
 log({type:kind,by:me,to,amt:nv-old,sub:kind==='set'?nv:null,note:$('#ar').value.trim().slice(0,60)});
 const txt={mint:'Emitidos '+fmt(amt)+' para ',set:'Saldo definido em '+fmt(amt)+' para ',remove:'Retirados '+fmt(amt)+' de '}[kind]+USERS[to].name+'.';
 setMsg(txt,'ok');render();
}

function desc(x){
 if(x.type==='att')return 'Presença em aula'+(x.amt<0?' (estorno)':'');
 if(x.type==='pix')return 'Pix: '+USERS[x.from].name+' → '+USERS[x.to].name;
 if(x.type==='mint')return 'Emissão de Fisk Dollars ('+USERS[x.by].name+')';
 if(x.type==='set')return 'Saldo definido em '+fmt(x.sub)+' ('+USERS[x.by].name+')';
 return 'Retirada ('+USERS[x.by].name+')';
}
function row(x,view){
 let d;
 if(x.type==='pix'){d=view?(x.from===view?-x.amt:x.amt):x.amt}else d=x.amt;
 const cls=d<0?'neg':'pos',sign=d<0?'−':'+';
 const who=view&&x.type!=='pix'?'':'';
 return `<div class="row"><div>${esc(desc(x))}${x.note?`<br><em>“${esc(x.note)}”</em>`:''}<small>${when(x.t)}${view?'':' · '+esc(USERS[x.to].name)}</small></div><div class="${cls}">${sign} ${fmt(Math.abs(d)).replace('F$ ','F$ ')}</div></div>`;
}

function streak(k){const a=Object.keys(S.att).sort().map(d=>S.att[d][k]).filter(Boolean);let c=0,b=0;for(const s of a){c=s==='p'?c+1:0;b=Math.max(b,c)}return{cur:c,best:b,last:a.slice(-7)}}
function streakHTML(k){const s=streak(k),pl=s.cur===1?'':'s';const dots=s.last.map(x=>`<span class='dot ${x}'>${x==='p'?'✔':'✖'}</span>`).join('');return `<div class='note streak'><div class='fl${s.cur?'':' off'}'>🔥</div><div><b>${s.cur}</b> aula${pl} seguida${pl}<small>Recorde: ${s.best} · cada presença vale F$ 3</small><div class='dots'>${dots||'<small>Nenhuma aula registrada ainda</small>'}</div></div></div>`}
function attHTML(){const day=S.att[adate]||{};const l=Object.keys(USERS).filter(k=>USERS[k].role==='aluno');return `<div class='note'><div class='title'>Chamada · +F$ 3 por presença</div><label for='ad'>Data da aula</label><input id='ad' type='date' value='${adate}'>${l.map(k=>{const s=day[k];return `<div class='row'><div>${esc(USERS[k].name)}<small>🔥 ${streak(k).cur} seguidas</small></div><div class='ab'><button class='mk ${s==='p'?'on':''}' data-k='${k}' data-s='p'>Presente</button><button class='mk f ${s==='f'?'on':''}' data-k='${k}' data-s='f'>Falta</button></div></div>`}).join('')}</div>`}
function mark(k,st){if(me!=='teacher'||!adate)return;const day=S.att[adate]=S.att[adate]||{},cur=day[k],lab=adate.split('-').reverse().slice(0,2).join('/');
 const mv=p=>{const d=p?3:-Math.min(3,S.bal[k]);S.bal[k]+=d;if(d)log({type:'att',by:me,to:k,amt:d,note:'Aula de '+lab})};
 if(cur===st){delete day[k];if(st==='p')mv(false)}else{day[k]=st;if(st==='p')mv(true);else if(cur==='p')mv(false)}
 const r=day[k];if(!Object.keys(day).length)delete S.att[adate];save();
 setMsg(USERS[k].name+': '+(r==='p'?'presente (+F$ 3)':r==='f'?'falta registrada':'marcação removida'),'ok');render()}
const ADD=`<div class='note'><div class='title'>Novo aluno</div><label for='nn'>Apelido (login)</label><input id='nn' autocapitalize='none'><label for='nm'>Nome</label><input id='nm'><label for='ns'>Senha (mín. 6)</label><input id='ns' type='password' autocomplete='new-password'><button class='btn' id='addu'>Cadastrar aluno</button></div>`;
function receiptHTML(x){return `<div class='note'><div class='top'><div class='fisk'>Fisk</div><div class='flag'></div></div><div class='title'>Comprovante de Pix</div><div class='bal'><b>${fmt(x.amt)}</b><img class='buddy' alt='Buddy' src='${BUDDY}'></div><div class='row'><div>De<small>${esc(USERS[x.from].name)}</small></div><div>Para<small>${esc(USERS[x.to].name)}</small></div></div>${x.note?`<div class='row'><div>Mensagem<small>${esc(x.note)}</small></div></div>`:''}<div class='serial'><span>${x.id}</span><span>${when(x.t)}</span></div><div class='legal'>Pix concluído! Falou Fisk, falou tudo!</div><button class='btn alt' id='newp'>Novo Pix</button></div>`}
function confirmHTML(){return `<div class='note'><div class='title'>Confirmar Pix</div><div class='bal'><b>${fmt(pend.amt)}</b></div><div class='row'><div>Para<small>${esc(USERS[pend.to].name)}</small></div></div>${pend.note?`<div class='row'><div>Mensagem<small>${esc(pend.note)}</small></div></div>`:''}<button class='btn' id='ok'>Confirmar</button><button class='btn alt' id='no'>Cancelar</button></div>`}
function rankHTML(){const l=Object.keys(USERS).filter(k=>USERS[k].role==='aluno').sort((a,b)=>S.bal[b]-S.bal[a]);return `<div class='note'><div class='title'>Ranking da turma</div>${l.map((k,i)=>`<div class='row'><div>${['🥇','🥈','🥉'][i]||(i+1)+'º'} ${esc(USERS[k].name)}</div><div class='pos'>${fmt(S.bal[k])}</div></div>`).join('')}<h3>Ofensiva 🔥</h3>${l.slice().sort((a,b)=>streak(b).cur-streak(a).cur).map(k=>`<div class='row'><div>${esc(USERS[k].name)}</div><div class='pos'>🔥 ${streak(k).cur}</div></div>`).join('')}</div>`}
async function chPw(){const p=$('#np').value;if(p.length<6)return fail('A senha precisa ter ao menos 6 caracteres.');const h=await sha(p);USERS[me].h=h;S.pw[me]=h;save();setMsg('Senha alterada neste aparelho.','ok');render()}
async function addUser(){const k=$('#nn').value.trim().toLowerCase().replace(/[^a-z0-9_]/g,''),nm=$('#nm').value.trim().slice(0,24),p=$('#ns').value;if(!k||!nm||p.length<6)return fail('Preencha apelido, nome e senha (mín. 6).');if(USERS[k])return fail('Esse apelido já existe.');const u={name:nm,role:'aluno',h:await sha(p)};USERS[k]=S.users[k]=u;S.bal[k]=0;save();setMsg(nm+' cadastrado(a).','ok');render()}
function bulk(){const amt=parseInt($('#aa').value,10);if(!amt||amt<1)return fail('Informe um valor válido.');const note=$('#ar').value.trim().slice(0,60);let n=0;for(const k in USERS)if(USERS[k].role==='aluno'){S.bal[k]+=amt;n++;log({type:me==='cadu'?'mint':'set',by:me,to:k,amt,sub:me==='cadu'?null:S.bal[k],note})}setMsg(fmt(amt)+' para '+n+' alunos.','ok');render()}
function render(){
 const app=$('#app');
 if(!me){
  app.innerHTML=`<div class="note login"><div style="display:flex;justify-content:center;align-items:center;gap:12px">${BADGE}<img class="buddy" style="width:84px;height:84px" alt="Buddy" src="${BUDDY}"></div><div class="title">Pix · Fisk Dollars</div>
  <label for="nick">Usuário</label><input id="nick" autocomplete="username" autocapitalize="none">
  <label for="pw">Senha</label><input id="pw" type="password" autocomplete="current-password">
  <button class="btn" id="go">Entrar</button><div class="msg ${msg?msg.k:''}">${msg?esc(msg.t):''}</div>
  <div class="legal">Falou Fisk, falou tudo! · Moeda válida em todas as atividades Fisk</div></div>`;
  $('#go').onclick=doLogin;$('#pw').onkeydown=e=>{if(e.key==='Enter')doLogin()};return;
 }
 const u=USERS[me],staff=u.role!=='aluno';
 const tabs=[['pix','Pix'],['ext','Extrato'],['rank','Ranking']].concat(staff?[['adm','Painel']]:[]);
 let body='';
 if(tab==='pix'&&rcpt){body=receiptHTML(rcpt)}else if(tab==='pix'&&pend){body=confirmHTML()}else if(tab==='pix'){
  const opts=Object.keys(USERS).filter(k=>k!==me).map(k=>`<option value="${k}">${USERS[k].name}</option>`).join('');
  body=`<div class="note"><div class="title">Enviar Pix</div>
  <label for="to">Para</label><select id="to">${opts}</select>
  <label for="amt">Valor (F$)</label><input id="amt" type="number" min="1" step="1" inputmode="numeric" placeholder="0">
  <label for="note">Mensagem (opcional)</label><input id="note" maxlength="60">
  <button class="btn" id="send">Enviar Pix</button></div>`;
 }else if(tab==='rank'){body=rankHTML()}else if(tab==='ext'){
  const mine=S.tx.filter(x=>(x.to===me||x.from===me)&&(filt==='all'||(filt==='in'?(x.to===me&&x.from!==me):x.from===me)));
  body=`<div class="note"><div class='title'>Extrato</div><select id='flt'><option value='all'>Tudo</option><option value='in' ${filt==='in'?'selected':''}>Recebidos</option><option value='out' ${filt==='out'?'selected':''}>Enviados</option></select>${mine.length?mine.map(x=>row(x,me)).join(''):'<div class="empty">Nenhuma movimentação ainda.</div>'}</div>`;
 }else{
  const total=Object.values(S.bal).reduce((a,b)=>a+b,0);
  const opts=Object.keys(USERS).map(k=>`<option value="${k}">${USERS[k].name}</option>`).join('');
  const acts=me==='cadu'?`<button class="btn" id="mint">Gerar Fisk Dollars</button>`:
   `<button class="btn" id="set">Definir saldo</button><button class="btn alt" id="rem">Retirar valor</button>`;
  body=`${attHTML()}<div class='note'><div class='title'>Gestão de saldos</div>
  <label for="au">Conta</label><select id="au">${opts}</select>
  <label for="aa">Valor (F$)</label><input id='aa' type='number' min='0' step='1' inputmode='numeric' placeholder='0'><label for='ar'>Motivo (opcional)</label><input id='ar' maxlength='60'>${acts}<button class='btn alt' id='bulk'>${me==='cadu'?'Emitir':'Adicionar'} a todos os alunos</button></div>
  <div class="note"><div class="title">Contas · em circulação ${fmt(total)}</div><div class="scroll"><table><tr><th>Usuário</th><th>Função</th><th>Saldo</th></tr>
  ${Object.keys(USERS).map(k=>`<tr><td>${USERS[k].name}</td><td>${ROLE[USERS[k].role]}</td><td>${fmt(S.bal[k])}</td></tr>`).join('')}</table></div>
  <h3>Últimas movimentações</h3>${S.tx.length?S.tx.slice(0,15).map(x=>row(x,null)).join(''):'<div class="empty">Nada por aqui ainda.</div>'}</div>${me==='teacher'?ADD:''}`;
 }
 app.innerHTML=`<div class="note"><div class="top"><div style="display:flex;align-items:center;gap:10px"><div class="fisk">Fisk</div><div class="flag"></div></div><div style="text-align:right"><div class="small">${ROLE[u.role]}</div><b>${esc(u.name)}</b></div></div>
 <div class="title">Fisk Dollars · Saldo disponível</div>
 <div class="bal"><b>${fmt(S.bal[me])}</b><img class="buddy" alt="Buddy" src="${BUDDY}"></div>
 <div class="serial"><span>${serial(me)}</span><span>Série 2026</span></div>
 <div class="legal">Falou Fisk, falou tudo! · Moeda válida em todas as atividades Fisk</div></div>
 ${u.role==='aluno'?streakHTML(me):''}
 <div class="tabs">${tabs.map(t=>`<button data-t="${t[0]}" class="${tab===t[0]?'on':''}">${t[1]}</button>`).join('')}</div>
 ${body}<div class="msg ${msg?msg.k:''}">${msg?esc(msg.t):''}</div>
 <details class='note'><summary class='small' style='cursor:pointer'>Alterar senha</summary><label for='np'>Nova senha (mín. 6)</label><input id='np' type='password' autocomplete='new-password'><button class='btn alt' id='pwb'>Salvar senha</button></details>
 <button class='btn alt' id='th' style='margin:4px 8px;width:calc(100% - 16px)'>Tema claro/escuro</button>
 <button class="btn alt" id="out" style="margin:4px 7px;width:calc(100% - 14px)">Sair</button>`;
 document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;pend=rcpt=null;msg=null;render()});
 $('#out').onclick=logout;
 const g=(id,f)=>{const e=$('#'+id);if(e)e.onclick=f};
 g('send',sendPix);g('ok',confirmPix);g('no',()=>{pend=null;render()});g('newp',()=>{rcpt=null;msg=null;render()});g('pwb',chPw);g('addu',addUser);g('bulk',bulk);g('th',()=>{const r=document.documentElement;const d=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=d?'light':'dark'});document.querySelectorAll('.mk').forEach(b=>b.onclick=()=>mark(b.dataset.k,b.dataset.s));const ad=$('#ad');if(ad)ad.onchange=()=>{adate=ad.value||adate;render()};const fl=$('#flt');if(fl)fl.onchange=()=>{filt=fl.value;render()};g('mint',()=>adminAct('mint'));g('set',()=>adminAct('set'));g('rem',()=>adminAct('remove'));
}
load();render();
</script>
</body>
